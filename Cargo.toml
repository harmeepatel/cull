[package]
name = "cull"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
dirs = "5.0"
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-desktop = "0.7"
kamadak-exif = "0.5"
crossbeam-channel = "0.5"
rayon = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2.7"
cocoa = "0.26"
