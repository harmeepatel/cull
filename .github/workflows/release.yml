name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon
            target: aarch64-apple-darwin
            artifact: cull-macos-arm64
          - os: macos-13            # Intel
            target: x86_64-apple-darwin
            artifact: cull-macos-x64
          - os: windows-latest      # 64-bit (Windows 10/11)
            target: x86_64-pc-windows-msvc
            artifact: cull-windows-x64
          - os: windows-latest      # 32-bit (older Windows)
            target: i686-pc-windows-msvc
            artifact: cull-windows-x86
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: cull-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dioxus-cli
        run: cargo install dioxus-cli --locked

      - name: Bundle
        run: dx bundle --release --target ${{ matrix.target }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=$(find dist -name "*.app" | head -1)
          zip -r ${{ matrix.artifact }}.zip "$APP"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse dist -Filter "*.exe" | Select-Object -First 1
          Compress-Archive -Path $exe.FullName -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          BIN=$(find dist -type f -executable | head -1)
          tar -czf ${{ matrix.artifact }}.tar.gz -C "$(dirname "$BIN")" "$(basename "$BIN")"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          generate_release_notes: true
